name: 일일 브리핑 에이전트 파이프라인

on:
  # PC 윈도우 작업 스케줄러 전환에 따라 깃허브 액션 자동 스케줄 비활성화 (지연/병목 원천 차단)
  # schedule:
  #   # 매일 아침 5시 47분 KST 실행 (UTC 20:47)
  #   - cron: '47 20 * * *'
  workflow_dispatch: # 수동 실행 활성화 (필요 시 웹에서 언제든 1회성 실행 가능)

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-nanum-coding
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 실행 에이전트
      env:
        # GitHub Repository Secrets에 아래의 비밀값들을 등록해야 작동합니다.
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        
        # 관심사 키워드 설정 (쉼표 구분)
        NEWS_KEYWORDS: ${{ secrets.NEWS_KEYWORDS || '거시 경제 증시, 금리 환율 부동산, 인공지능 AI 반도체, 미래 모빌리티 2차전지 배터리, 바이오 제약 신약 헬스케어, 방산 우주항공 조선 수주, 원전 SMR 신재생에너지 전력인프라, 국제 정세 외교, 국내 정치, 스포츠 경기 결과 KBO 손흥민' }}
        
        # 전송용 채널 Webhook 및 토큰들
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        
        # 이메일 발송용 SMTP 설정
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        NAVER_BLOG_EMAIL: ${{ secrets.NAVER_BLOG_EMAIL }}
        NAVER_BLOG_CATEGORY: ${{ secrets.NAVER_BLOG_CATEGORY || '일일 브리핑' }}
      run: |
        python main.py
